name = "phuquoc-careers-api"
main = "worker/src/router.mjs"
compatibility_date = "2026-10-01"

# Production topology: one Worker deployment serves both the approved static UI
# and /api/* so candidate/HR flows remain same-origin.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

[[d1_databases]]
binding = "DB"
database_name = "phuquoc-careers"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "migrations"

[vars]
APP_MARKET = "PHU_QUOC"
HR_SESSION_HOURS = "12"

[secrets]
required = [ "PII_KEY", "INTERNAL_API_TOKEN" ]
