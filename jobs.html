<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tìm việc tại Phú Quốc - PhuQuocCareers</title>
  <meta name="description" content="Tìm và so sánh việc làm tại Phú Quốc theo lương, service charge, chỗ ở, shuttle, ngày nghỉ và khu vực.">
  <link rel="stylesheet" href="assets/candidate-premium.css">
</head>
<body data-page="jobs">
<header class="topbar">
  <div class="container nav">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="PhuQuocCareers"></a>
    <nav class="navlinks"><a class="active" href="jobs.html">Tìm việc</a><a href="careers.html">Nghề của tôi</a><a href="jobs.html?saved=1">Đã lưu</a><a href="compare.html">So sánh</a></nav>
    <div class="nav-actions"><a class="btn btn-soft" href="employer/post.html">Dành cho nhà tuyển dụng →</a><button class="btn btn-icon mobile-menu" id="filterToggle" aria-label="Mở bộ lọc">☰</button></div>
  </div>
</header>

<section class="results-head">
  <div class="container">
    <div class="results-mobile-title">Tìm việc phù hợp</div>
    <div class="eyebrow">Tìm theo nhu cầu hoặc tự lọc</div>
    <h1 id="resultsTitle">Các lựa chọn đáng xem cho bạn</h1>
    <div class="results-search">
      <div class="search-input-wrap"><span class="search-symbol">⌕</span><input id="resultQuery" placeholder="Ví dụ: F&B tại Nam đảo, có chỗ ở"></div>
      <button id="resultSearch" class="btn btn-primary search-again">Tìm lại <span>→</span></button>
      <button id="filterToggle2" class="btn btn-icon filter-mobile" aria-label="Bộ lọc" onclick="document.getElementById('filterPanel').classList.toggle('open')">☷</button>
    </div>
    <div id="interpreted" class="interpreted"></div>
    <div class="results-tabs" aria-label="Cách xem kết quả">
      <button class="result-tab active" data-view="worth">Đáng xem trước</button>
      <button class="result-tab" data-view="life">Đúng điều kiện sống</button>
      <button class="result-tab" data-view="income">Thu nhập tốt hơn</button>
      <button class="result-tab" data-view="near">Gần khu bạn muốn</button>
      <button class="result-tab" data-view="questions">Cần hỏi HR</button>
    </div>
  </div>
</section>

<main class="container results-layout">
  <aside id="filterPanel" class="filter-panel">
    <div class="filter-head"><div><span>Bộ lọc</span><strong>Tự chọn điều quan trọng</strong></div><button id="clearFilters" class="btn btn-sm btn-soft">Xóa</button></div>
    <div class="filter-group"><strong>Khu vực</strong><select data-filter="zone"><option value="">Toàn Phú Quốc</option><option>Nam đảo</option><option>Bãi Trường</option><option>Dương Đông</option><option>Bắc đảo</option></select></div>
    <div class="filter-group"><strong>Ngành nghề</strong><select data-filter="dept"><option value="">Mọi ngành</option><option>F&B</option><option>Front Office</option><option>Housekeeping</option><option>Reservations</option><option>Nhân sự</option><option>Spa & Wellness</option><option>Kỹ thuật</option><option>Sales & Marketing</option></select></div>
    <div class="filter-group"><strong>Điều kiện sống</strong><label class="check"><input type="checkbox" data-filter="house"> Có đề cập chỗ ở</label><label class="check"><input type="checkbox" data-filter="salary"> Có công khai lương</label></div>
  </aside>

  <section class="results-main">
    <div class="results-toolbar"><div><strong id="resultCount">0 việc</strong><span class="results-note"> · ưu tiên theo điều bạn đã nói</span></div><select aria-label="Cách xem"><option>Phù hợp trước</option></select></div>
    <div id="resultList" class="job-list"></div>
  </section>
</main>

<div id="compareDrawer" class="compare-drawer"></div>
<script src="data/jobs.js"></script>
<script src="/api/jobs.js"></script>
<script src="assets/candidate.js"></script>
<script src="assets/mobile-nav.js"></script>
</body>
</html>
