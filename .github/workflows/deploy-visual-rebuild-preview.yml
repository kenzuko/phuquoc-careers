name: Deploy isolated visual rebuild preview

on:
  push:
    branches:
      - feat/visual-rebuild
    paths:
      - '.github/workflows/deploy-visual-rebuild-preview.yml'
      - 'index.html'
      - 'jobs.html'
      - 'job.html'
      - 'careers.html'
      - 'compare.html'
      - 'assets/home-luxe.css'
      - 'assets/candidate-luxe.css'
      - 'assets/candidate-careers.css'
      - 'assets/candidate-careers.js'
      - 'assets/candidate-compare.css'
      - 'assets/compare.js'
      - 'assets/candidate.js'
      - 'assets/mobile-nav.js'

permissions:
  contents: read

concurrency:
  group: phuquoc-careers-visual-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_URL: https://phuquoc-careers-visual-preview.kenzuko.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate visual branch
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node --check assets/candidate.js
          node --check assets/candidate-careers.js
          node --check assets/compare.js
          node --check assets/mobile-nav.js
          npm test
          npm run deploy:check:strict
      - name: Deploy isolated read-only preview
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PII_KEY="$(openssl rand -hex 32)"
          INTERNAL_API_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PII_KEY"
          echo "::add-mask::$INTERNAL_API_TOKEN"
          SECRETS_FILE="$RUNNER_TEMP/pqc-visual-preview-secrets.env"
          printf 'PII_KEY=%s\nINTERNAL_API_TOKEN=%s\n' "$PII_KEY" "$INTERNAL_API_TOKEN" > "$SECRETS_FILE"
          npx --yes wrangler@4.146.0 deploy --name phuquoc-careers-visual-preview --secrets-file "$SECRETS_FILE"
      - name: Smoke visual preview
        shell: bash
        run: |
          set -euo pipefail
          for path in / /jobs.html /job.html /careers.html /compare.html /assets/home-luxe.css /assets/candidate-luxe.css /assets/candidate-careers.css /assets/candidate-compare.css /assets/candidate.js /assets/candidate-careers.js /assets/compare.js /api/health /api/readiness /api/jobs.js; do
            ok=0
            for i in $(seq 1 15); do
              if curl -fsS --max-time 10 "$PREVIEW_URL$path" >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = "1"
            echo "ok $path"
          done
          curl -fsS "$PREVIEW_URL/api/readiness" > /tmp/readiness.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/readiness.json'))
          launch=d.get('launch') or {}
          assert launch == {'candidateWrites': False, 'employerClaims': False, 'hrAuth': False}, launch
          print({'isolatedVisualPreview': True, 'launch': launch})
          PY
