name: Deploy visual V2 read-only preview

on:
  push:
    branches:
      - feat/v1-decision-layer
    paths:
      - .github/workflows/deploy-visual-v2.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-decision-layer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current branch
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm test
          npm run db:seed
          npm run deploy:check:strict
      - name: Keep D1 current
        run: |
          npx --yes wrangler@4.146.0 d1 migrations apply phuquoc-careers --remote
          npx --yes wrangler@4.146.0 d1 execute phuquoc-careers --remote --file=pipeline/generated/d1-seed.sql
      - name: Deploy visual V2 read-only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PII_KEY="$(openssl rand -hex 32)"
          INTERNAL_API_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$PII_KEY"
          echo "::add-mask::$INTERNAL_API_TOKEN"
          printf 'PII_KEY=%s\nINTERNAL_API_TOKEN=%s\n' "$PII_KEY" "$INTERNAL_API_TOKEN" > "$RUNNER_TEMP/pqc-preview-secrets.env"
          npx --yes wrangler@4.146.0 deploy --secrets-file "$RUNNER_TEMP/pqc-preview-secrets.env"
          echo "PQC_PREVIEW_URL=https://phuquoc-careers-api.kenzuko.workers.dev" >> "$GITHUB_ENV"
      - name: Smoke live preview
        run: |
          PQC_BASE_URL="$PQC_PREVIEW_URL" npm run smoke
          curl -fsS "$PQC_PREVIEW_URL/api/readiness" > /tmp/readiness.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/readiness.json'))
          launch=d.get('launch') or {}
          assert launch == {'candidateWrites': False, 'employerClaims': False, 'hrAuth': False}, launch
          print({'visualV2': True, 'readOnlyPreview': True, 'launch': launch})
          PY
      - name: Verify custom domains
        shell: bash
        run: |
          set -euo pipefail
          for url in https://phuquoccareers.com https://www.phuquoccareers.com; do
            ok=0
            for i in $(seq 1 12); do
              if curl -fsS --max-time 15 "$url" >/dev/null; then
                echo "ok $url"
                ok=1
                break
              fi
              echo "waiting for custom domain: $url (attempt $i/12)"
              sleep 10
            done
            test "$ok" = 1
          done
