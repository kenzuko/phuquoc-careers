name: Deploy PhuQuocCareers V11 to live domain

on:
  push:
    branches:
      - feat/visual-rebuild
    paths:
      - '.github/workflows/deploy-visual-live.yml'
      - 'index.html'
      - 'jobs.html'
      - 'job.html'
      - 'careers.html'
      - 'compare.html'
      - 'phu-quoc-now.html'
      - 'life-in-phu-quoc.html'
      - 'employers.html'
      - 'employer-profile.html'
      - 'employer.html'
      - 'employer/post.html'
      - 'employer/dashboard.html'
      - 'assets/candidate-v5-core.css'
      - 'assets/home-v5.css'
      - 'assets/jobs-v5.css'
      - 'assets/job-v5.css'
      - 'assets/careers-v5.css'
      - 'assets/compare-v5.css'
      - 'assets/candidate-approved-accent.css'
      - 'assets/candidate-living-v6.css'
      - 'assets/candidate-v6-pages.css'
      - 'assets/experience-v7.css'
      - 'assets/experience-v8.css'
      - 'assets/site-shell-v9.css'
      - 'assets/site-shell-v10.css'
      - 'assets/interaction-v11.css'
      - 'assets/experience-v7.js'
      - 'assets/nav-v10.js'
      - 'assets/employers-directory.js'
      - 'assets/employer-v5.css'
      - 'assets/employer-profile.js'
      - 'assets/candidate.js'
      - 'assets/candidate-careers.js'
      - 'assets/compare.js'
      - 'assets/mobile-nav.js'
      - 'assets/living-motion.js'
      - 'assets/logo.svg'
      - 'assets/logo-official.png.b64'
      - 'assets/logo-mark.jpg.b64'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phuquoc-careers-live-visual
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ROOT_URL: https://phuquoccareers.com
      WWW_URL: https://www.phuquoccareers.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize official PQC brand assets
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/logo-official.png.b64 > assets/logo-official.png
          base64 --decode assets/logo-mark.jpg.b64 > assets/logo-mark.jpg
          python3 - <<'PY'
          import struct
          b=open('assets/logo-official.png','rb').read(32)
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II', b[16:24])
          assert (w,h)==(300,216),(w,h)
          j=open('assets/logo-mark.jpg','rb').read(3)
          assert j[:2] == b'\xff\xd8', j
          print({'officialLogo':True,'width':w,'height':h,'croppedMark':True})
          PY

      - name: Validate V11 before live deploy
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          for f in life-in-phu-quoc.html employers.html employer-profile.html assets/experience-v7.css assets/experience-v8.css assets/site-shell-v9.css assets/site-shell-v10.css assets/interaction-v11.css assets/experience-v7.js assets/nav-v10.js assets/employers-directory.js assets/employer-v5.css assets/employer-profile.js assets/logo-mark.jpg; do test -s "$f"; done
          node --check assets/experience-v7.js
          node --check assets/nav-v10.js
          node --check assets/employers-directory.js
          node --check assets/employer-profile.js
          node --check assets/candidate-careers.js
          node --check assets/mobile-nav.js
          grep -q 'Tìm theo cách quen thuộc' jobs.html
          grep -q 'manual-search-head' jobs.html
          grep -q 'Phú Quốc đang có những nhóm nghề nào' careers.html
          grep -q 'Những nhóm phía trên được lấy từ các công việc đang mở' assets/candidate-careers.js
          grep -q 'textarea id="smartQuery"' index.html
          grep -q 'interaction-v11.css' index.html
          grep -q 'interaction-v11.css' careers.html
          grep -q 'employers.html' index.html
          grep -q 'Đã xác minh trực tiếp' assets/employers-directory.js
          grep -q 'grid-template-columns:1fr' assets/site-shell-v10.css
          grep -q 'Liên hệ & trang chính thức' assets/employer-profile.js
          grep -q 'Chưa xác minh trực tiếp' assets/employer-profile.js
          grep -q 'openphuquoc.com' phu-quoc-now.html
          npm test
          npm run deploy:check:strict
          grep -q 'CANDIDATE_WRITES_ENABLED = "false"' wrangler.toml
          grep -q 'EMPLOYER_CLAIMS_ENABLED = "false"' wrangler.toml
          grep -q 'HR_AUTH_MODE = "disabled"' wrangler.toml

      - name: Deploy V11 to existing live Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.146.0 deploy 2>&1 | tee "$RUNNER_TEMP/live-deploy.log"

      - name: Verify live domain
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$ROOT_URL/api/readiness" >/tmp/live-readiness.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/live-readiness.json'))
          assert data.get('ok') is True,data
          launch=data.get('launch') or {}
          assert launch=={'candidateWrites':False,'employerClaims':False,'hrAuth':False},launch
          print({'live':True,'launch':launch})
          PY
          for path in / /jobs.html /job.html /careers.html /compare.html /phu-quoc-now.html /life-in-phu-quoc.html /employers.html /employer.html /employer/post.html /employer/dashboard.html '/employer-profile.html?name=InterContinental%20Phu%20Quoc%20Long%20Beach%20Resort' /assets/logo-official.png /assets/logo-mark.jpg /assets/site-shell-v9.css /assets/site-shell-v10.css /assets/interaction-v11.css /assets/nav-v10.js /assets/employers-directory.js /assets/employer-profile.js /assets/candidate-careers.js; do
            ok=0
            for i in $(seq 1 12); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$ROOT_URL$path" || true)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = "1"
            echo "200 $path"
          done
          curl -fsS "$ROOT_URL/" -o /tmp/pqc-home.html
          grep -q 'textarea id="smartQuery"' /tmp/pqc-home.html
          curl -fsS "$ROOT_URL/careers.html" -o /tmp/pqc-careers.html
          grep -q 'Phú Quốc đang có những nhóm nghề nào' /tmp/pqc-careers.html
          curl -fsS "$ROOT_URL/employers.html" -o /tmp/pqc-employers.html
          grep -q 'Nhà tuyển dụng tại Phú Quốc' /tmp/pqc-employers.html
          headers="$(curl -sSI "$WWW_URL/jobs.html?from=www")"
          echo "$headers" | grep -Eq '^HTTP/.* 301'
          echo "$headers" | tr -d '\r' | grep -Fqi 'location: https://phuquoccareers.com/jobs.html?from=www'

      - name: Record live V11 deploy
        run: |
          echo "## PhuQuocCareers V11 live" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smart need input is a true two-line field: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Career groups are derived from current live jobs: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Career cards show current open-job counts: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- No auto-assigned career on first load: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Career path is reference-only and explained: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate writes / employer claims / HR auth: OFF" >> "$GITHUB_STEP_SUMMARY"
