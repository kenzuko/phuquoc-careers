name: Deploy PhuQuocCareers product to live domain

on:
  push:
    branches:
      - feat/visual-rebuild
    paths:
      - '.github/workflows/deploy-visual-live.yml'
      - 'wrangler.toml'
      - 'package.json'
      - '*.html'
      - 'employer/**'
      - 'assets/**'
      - 'worker/**'
      - 'migrations/**'
      - 'data/**'
      - 'pipeline/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phuquoc-careers-live-product
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ROOT_URL: https://phuquoccareers.com
      WWW_URL: https://www.phuquoccareers.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize official PQC brand assets
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/logo-official.png.b64 > assets/logo-official.png
          base64 --decode assets/logo-mark.jpg.b64 > assets/logo-mark.jpg
          python3 - <<'PY'
          import struct
          b=open('assets/logo-official.png','rb').read(32)
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II', b[16:24])
          assert (w,h)==(300,216),(w,h)
          j=open('assets/logo-mark.jpg','rb').read(3)
          assert j[:2] == b'\xff\xd8', j
          print({'officialLogo':True,'width':w,'height':h,'croppedMark':True})
          PY

      - name: Validate product before live deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          for f in account.html life-in-phu-quoc.html careers.html jobs.html quick-post.html workplace-map.html employers.html employer-profile.html assets/account.css assets/account.js assets/quick-post.js assets/jobs-market.js assets/life-tools.js assets/workplace-map.js assets/experience-v7.css assets/site-shell-v10.css assets/nav-v12.css assets/experience-v7.js assets/nav-v10.js assets/mobile-nav.js assets/employers-directory.js assets/employer-profile.js worker/src/accounts.mjs worker/src/quick-jobs.mjs worker/src/workplaces.mjs worker/src/router.mjs migrations/0011_accounts.sql migrations/0012_marketplace_core.sql; do test -s "$f"; done
          for f in assets/account.js assets/quick-post.js assets/jobs-market.js assets/life-tools.js assets/workplace-map.js assets/experience-v7.js assets/nav-v10.js assets/mobile-nav.js assets/employers-directory.js assets/employer-profile.js assets/candidate-careers.js worker/src/accounts.mjs worker/src/quick-jobs.mjs worker/src/workplaces.mjs worker/src/router.mjs; do node --check "$f"; done
          grep -q "grid-template-columns:repeat(4,minmax(0,1fr))" assets/nav-v12.css
          grep -q "Sống & làm việc" assets/mobile-nav.js
          grep -q "account.html" assets/nav-v10.js
          grep -q "pqc-nav-popover" assets/nav-v10.js
          grep -q "Tạo tài khoản" account.html
          grep -q "Tạo tài khoản không đồng nghĩa đã xác minh" account.html
          grep -q "PBKDF2" worker/src/accounts.mjs
          grep -q "HttpOnly; Secure; SameSite=Lax" worker/src/accounts.mjs
          grep -q "quickJobRoute" worker/src/router.mjs
          grep -q "workplaceRoute" worker/src/router.mjs
          grep -q "capabilities:{accounts:true,quickJobs:true,workplaces:true}" worker/src/router.mjs
          grep -q "CREATE TABLE IF NOT EXISTS quick_job_posts" migrations/0012_marketplace_core.sql
          grep -q "CREATE TABLE IF NOT EXISTS workplaces" migrations/0012_marketplace_core.sql
          ! grep -q 'enhancePrimaryNav()' assets/experience-v7.js
          ! grep -q 'addJourneyLinks()' assets/experience-v7.js
          grep -q 'Tìm theo cách quen thuộc' jobs.html
          grep -q 'Hiểu nghề trước khi chọn chỗ làm' careers.html
          grep -q 'Nếu nhận việc ở đây, cuộc sống của mình sẽ ra sao' life-in-phu-quoc.html
          grep -q 'textarea id="smartQuery"' index.html
          grep -q 'Liên hệ & trang chính thức' assets/employer-profile.js
          grep -q 'openphuquoc.com' phu-quoc-now.html
          npm test
          npm run deploy:check:strict
          npm run db:seed
          grep -q 'CANDIDATE_WRITES_ENABLED = "false"' wrangler.toml
          grep -q 'EMPLOYER_CLAIMS_ENABLED = "false"' wrangler.toml
          grep -q 'HR_AUTH_MODE = "disabled"' wrangler.toml

      - name: Apply D1 schema migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.146.0 d1 migrations apply phuquoc-careers --remote

      - name: Sync verified job data to D1
        shell: bash
        run: |
          set -euo pipefail
          test -s pipeline/generated/d1-seed.sql
          npx --yes wrangler@4.146.0 d1 execute phuquoc-careers --remote --file=pipeline/generated/d1-seed.sql

      - name: Deploy product to existing live Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.146.0 deploy 2>&1 | tee "$RUNNER_TEMP/live-deploy.log"

      - name: Verify live domain
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$ROOT_URL/api/readiness" >/tmp/live-readiness.json 2>/dev/null; then
              if python3 - <<'PY'
          import json,sys
          try:data=json.load(open('/tmp/live-readiness.json'))
          except Exception:sys.exit(1)
          launch=data.get('launch') or {}; caps=data.get('capabilities') or {}
          ok=(data.get('ok') is True and launch=={'candidateWrites':False,'employerClaims':False,'hrAuth':False} and caps.get('accounts') is True and caps.get('quickJobs') is True and caps.get('workplaces') is True)
          sys.exit(0 if ok else 1)
          PY
              then ready=1; break; fi
            fi
            sleep 4
          done
          test "$ready" = "1"
          for path in / /account.html /jobs.html /job.html /careers.html /compare.html /phu-quoc-now.html /life-in-phu-quoc.html /quick-post.html /workplace-map.html /employers.html /employer.html /employer/post.html /employer/dashboard.html /assets/quick-post.js /assets/jobs-market.js /assets/life-tools.js /assets/workplace-map.js /assets/candidate-careers.js; do
            ok=0
            for i in $(seq 1 12); do code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$ROOT_URL$path" || true)"; if [ "$code" = "200" ]; then ok=1; break; fi; sleep 2; done
            test "$ok" = "1"; echo "200 $path"
          done
          curl -fsS "$ROOT_URL/" -o /tmp/pqc-home.html
          grep -q 'Công việc tốt hơn, trải nghiệm tốt hơn, cuộc sống tốt hơn' /tmp/pqc-home.html
          curl -fsS "$ROOT_URL/api/workplaces" -o /tmp/pqc-workplaces.json
          grep -q '"items"' /tmp/pqc-workplaces.json
          curl -fsS "$ROOT_URL/api/quick-jobs" -o /tmp/pqc-quick.json
          grep -q '"items"' /tmp/pqc-quick.json
          me_code="$(curl -sS -o /tmp/pqc-me.json -w '%{http_code}' "$ROOT_URL/api/accounts/me")"
          test "$me_code" = "401"
          grep -q 'authenticated' /tmp/pqc-me.json
          curl -fsS "$ROOT_URL/api/jobs.js" -o /tmp/pqc-jobs.js
          grep -q 'window.PQC_JOBS' /tmp/pqc-jobs.js
          headers="$(curl -sSI "$WWW_URL/jobs.html?from=www")"
          echo "$headers" | grep -Eq '^HTTP/.* 301'
          echo "$headers" | tr -d '\r' | grep -Fqi 'location: https://phuquoccareers.com/jobs.html?from=www'

      - name: Record live deploy
        run: |
          echo "## PhuQuocCareers marketplace core live" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hospitality: deep/core vertical" >> "$GITHUB_STEP_SUMMARY"
          echo "- Other industries: demand-driven, no empty taxonomy in UI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quick hiring posts: authenticated submission + moderation pending" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workplace map: exact/verified-address coordinates only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate writes / legacy employer claims / HR publishing gates remain OFF" >> "$GITHUB_STEP_SUMMARY"
