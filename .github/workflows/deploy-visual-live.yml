name: Deploy PhuQuocCareers V8 to live domain

on:
  push:
    branches:
      - feat/visual-rebuild
    paths:
      - '.github/workflows/deploy-visual-live.yml'
      - 'index.html'
      - 'jobs.html'
      - 'job.html'
      - 'careers.html'
      - 'compare.html'
      - 'phu-quoc-now.html'
      - 'life-in-phu-quoc.html'
      - 'employer-profile.html'
      - 'assets/candidate-v5-core.css'
      - 'assets/home-v5.css'
      - 'assets/jobs-v5.css'
      - 'assets/job-v5.css'
      - 'assets/careers-v5.css'
      - 'assets/compare-v5.css'
      - 'assets/candidate-approved-accent.css'
      - 'assets/candidate-living-v6.css'
      - 'assets/candidate-v6-pages.css'
      - 'assets/experience-v7.css'
      - 'assets/experience-v8.css'
      - 'assets/experience-v7.js'
      - 'assets/employer-profile.js'
      - 'assets/candidate.js'
      - 'assets/candidate-careers.js'
      - 'assets/compare.js'
      - 'assets/mobile-nav.js'
      - 'assets/living-motion.js'
      - 'assets/logo.svg'
      - 'assets/logo-official.png.b64'
      - 'assets/logo-mark.jpg.b64'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phuquoc-careers-live-visual
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ROOT_URL: https://phuquoccareers.com
      WWW_URL: https://www.phuquoccareers.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize official PQC brand assets
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/logo-official.png.b64 > assets/logo-official.png
          base64 --decode assets/logo-mark.jpg.b64 > assets/logo-mark.jpg
          python3 - <<'PY'
          import struct
          b=open('assets/logo-official.png','rb').read(32)
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          w,h=struct.unpack('>II', b[16:24])
          assert (w,h)==(300,216),(w,h)
          j=open('assets/logo-mark.jpg','rb').read(3)
          assert j[:2] == b'\xff\xd8', j
          print({'officialLogo':True,'width':w,'height':h,'croppedMark':True})
          PY

      - name: Validate V8 before live deploy
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          for f in life-in-phu-quoc.html employer-profile.html assets/experience-v7.css assets/experience-v8.css assets/experience-v7.js assets/employer-profile.js assets/logo-mark.jpg; do test -s "$f"; done
          node --check assets/experience-v7.js
          node --check assets/employer-profile.js
          node --check assets/mobile-nav.js
          grep -q 'Nói nhu cầu của tôi' index.html
          grep -q 'Sống & làm việc ở Phú Quốc' index.html
          grep -q 'Phú Quốc ngay lúc này' index.html
          grep -q 'logo-mark.jpg' assets/experience-v8.css
          grep -q 'Liên hệ & trang chính thức' assets/employer-profile.js
          grep -q 'Chưa xác minh trực tiếp' assets/employer-profile.js
          grep -q 'openphuquoc.com' phu-quoc-now.html
          grep -q 'worklife-strip' assets/experience-v7.js
          npm test
          npm run deploy:check:strict
          grep -q 'CANDIDATE_WRITES_ENABLED = "false"' wrangler.toml
          grep -q 'EMPLOYER_CLAIMS_ENABLED = "false"' wrangler.toml
          grep -q 'HR_AUTH_MODE = "disabled"' wrangler.toml

      - name: Deploy V8 to existing live Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.146.0 deploy 2>&1 | tee "$RUNNER_TEMP/live-deploy.log"

      - name: Verify live domain
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "$ROOT_URL/api/readiness" >/tmp/live-readiness.json 2>/dev/null; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/live-readiness.json'))
          assert data.get('ok') is True,data
          launch=data.get('launch') or {}
          assert launch=={'candidateWrites':False,'employerClaims':False,'hrAuth':False},launch
          print({'live':True,'launch':launch})
          PY
          for path in / /jobs.html /job.html /careers.html /compare.html /phu-quoc-now.html /life-in-phu-quoc.html '/employer-profile.html?name=InterContinental%20Phu%20Quoc%20Long%20Beach%20Resort' /assets/logo-official.png /assets/logo-mark.jpg /assets/experience-v7.css /assets/experience-v8.css /assets/experience-v7.js /assets/employer-profile.js /assets/mobile-nav.js; do
            ok=0
            for i in $(seq 1 12); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$ROOT_URL$path" || true)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = "1"
            echo "200 $path"
          done
          curl -fsS "$ROOT_URL/" | grep -q 'Sống & làm việc ở Phú Quốc'
          curl -fsS "$ROOT_URL/employer-profile.html?name=InterContinental%20Phu%20Quoc%20Long%20Beach%20Resort" | grep -q 'Nhà tuyển dụng'
          headers="$(curl -sSI "$WWW_URL/jobs.html?from=www")"
          echo "$headers" | grep -Eq '^HTTP/.* 301'
          echo "$headers" | tr -d '\r' | grep -Fqi 'location: https://phuquoccareers.com/jobs.html?from=www'

      - name: Record live V8 deploy
        run: |
          echo "## PhuQuocCareers V8 live" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cropped official PQC mark + readable brand name: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Human + island photo rhythm: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hero slider with living captions: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live jobs + island pulse: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Employer public contact context: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Truthful employer verification status: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rich ecosystem footer: ON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate writes / employer claims / HR auth: OFF" >> "$GITHUB_STEP_SUMMARY"
