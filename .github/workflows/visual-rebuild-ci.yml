name: Visual rebuild CI

on:
  pull_request:
    paths:
      - 'index.html'
      - 'jobs.html'
      - 'job.html'
      - 'careers.html'
      - 'compare.html'
      - 'employer.html'
      - 'employer/post.html'
      - 'employer/dashboard.html'
      - 'assets/candidate.css'
      - 'assets/candidate.js'
      - 'assets/candidate-mobile.css'
      - 'assets/mobile-nav.js'
      - 'assets/candidate-careers.css'
      - 'assets/candidate-careers.js'
      - 'assets/candidate-compare.css'
      - 'assets/compare.js'
      - 'assets/employer.css'
      - 'assets/affective-ui.css'
      - 'docs/VISUAL_DECISION_UX_LOCK.md'
      - '.github/workflows/visual-rebuild-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Candidate presentation syntax
        run: |
          node --check assets/candidate.js
          node --check assets/candidate-careers.js
          node --check assets/compare.js
          node --check assets/mobile-nav.js
          test -s assets/candidate.css
          test -s assets/candidate-mobile.css
          test -s assets/candidate-careers.css
          test -s assets/candidate-compare.css
          grep -q 'data-page="home"' index.html
          grep -q 'data-page="jobs"' jobs.html
          grep -q 'data-page="job"' job.html
          grep -q 'data-page="careers"' careers.html
          grep -q 'data-page="compare"' compare.html
          for f in index.html jobs.html job.html careers.html compare.html; do
            grep -q 'assets/candidate.css' "$f"
            grep -q 'assets/candidate-mobile.css' "$f"
            grep -q 'assets/mobile-nav.js' "$f"
            ! grep -q 'visual-v2.css' "$f"
          done
          for f in index.html jobs.html job.html; do
            ! grep -q 'assets/affective-ui.css' "$f"
            ! grep -q 'assets/app.js' "$f"
          done
          grep -q 'class="market market-raised"' index.html
          grep -q 'class="detail-photo-tools"' job.html
          grep -q 'class="results-mobile-title"' jobs.html
      - name: Employer presentation isolation
        run: |
          test -s assets/employer.css
          test -s assets/affective-ui.css
          grep -q 'data-page="employers"' employer.html
          grep -q 'data-page="post"' employer/post.html
          grep -q 'data-page="hr-dashboard"' employer/dashboard.html
          grep -q 'assets/employer.css' employer.html
          grep -q '../assets/employer.css' employer/post.html
          grep -q '../assets/employer.css' employer/dashboard.html
          grep -q 'assets/affective-ui.css' employer.html
          grep -q '../assets/affective-ui.css' employer/post.html
          grep -q '../assets/affective-ui.css' employer/dashboard.html
          ! grep -q 'visual-v2.css' employer.html
          ! grep -q 'visual-v2.css' employer/post.html
          ! grep -q 'visual-v2.css' employer/dashboard.html
          ! grep -q 'assets/styles.css' employer.html
          ! grep -q '../assets/styles.css' employer/post.html
          ! grep -q '../assets/styles.css' employer/dashboard.html
          ! grep -q '../assets/hr-dashboard.css' employer/dashboard.html
          ! grep -q '../assets/hr-pipeline.css' employer/dashboard.html
          ! grep -q '../assets/hr-interview.css' employer/dashboard.html
          ! grep -q '../assets/hr-offer.css' employer/dashboard.html
          ! grep -q '../assets/hr-followup.css' employer/dashboard.html
          ! grep -q '../assets/hr-retention.css' employer/dashboard.html
          grep -q 'id="claimEmployer"' employer.html
          grep -q 'id="claimSubmit"' employer.html
          grep -q 'id="jdText"' employer/post.html
          grep -q 'id="parseBtn"' employer/post.html
          grep -q 'id="parseResult"' employer/post.html
          grep -q 'id="hrWorkspace"' employer/dashboard.html
          grep -q 'id="hrJobs"' employer/dashboard.html
          grep -q 'id="hrCandidates"' employer/dashboard.html
      - name: Existing product tests
        run: npm test
      - name: Deployment contract remains valid
        run: npm run deploy:check:strict
