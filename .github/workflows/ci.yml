name: CI

on:
  pull_request:
  push:
    branches:
      - feat/v1-decision-layer
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check assets/app.js
          node --check assets/api-bridge.js
          node --check worker/src/index.mjs
      - name: Test pipeline and domain rules
        run: npm test
      - name: Verify generated D1 seed
        run: |
          npm run db:seed
          test -s migrations/0002_seed.generated.sql
