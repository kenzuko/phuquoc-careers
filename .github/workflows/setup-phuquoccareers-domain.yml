name: Setup phuquoccareers.com zone

on:
  push:
    branches:
      - feat/v1-decision-layer
    paths:
      - .github/workflows/setup-phuquoccareers-domain.yml

permissions:
  contents: read

jobs:
  zone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-decision-layer
      - name: Ensure Cloudflare zone exists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, sys

          token=os.environ['CLOUDFLARE_API_TOKEN']
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          name='phuquoccareers.com'
          base='https://api.cloudflare.com/client/v4'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          def call(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  try:
                      print(e.read().decode())
                  except Exception:
                      print(str(e))
                  raise

          q=urllib.parse.urlencode({'name':name,'account.id':account,'per_page':'50'})
          out=call('GET',f'/zones?{q}')
          if not out.get('success'):
              print(json.dumps(out,indent=2)); sys.exit(2)
          zones=out.get('result') or []
          if zones:
              zone=zones[0]
              print('ZONE_EXISTS')
          else:
              out=call('POST','/zones',{'account':{'id':account},'name':name,'type':'full'})
              if not out.get('success'):
                  print(json.dumps(out,indent=2)); sys.exit(3)
              zone=out['result']
              print('ZONE_CREATED')

          print('ZONE_ID='+str(zone.get('id','')))
          print('ZONE_STATUS='+str(zone.get('status','')))
          for ns in zone.get('name_servers') or []:
              print('NAMESERVER='+ns)
          PY
